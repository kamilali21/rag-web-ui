events {
    worker_connections 1024;
}

http {
    client_max_body_size 100M;
    map_hash_bucket_size 256;

    # VS Code Dev Tunnels rewrites this tunnel's Origin to http://localhost:80.
    # Restore ONLY its exact HTTPS, same-origin browser request. Never replace
    # arbitrary/missing origins or trust a forwarded hostname by itself.
    # Keep the explicit tunnel address in sync with AUTH_ORIGIN in local .env.
    # This development-only rule is not part of deploy/nginx.conf.template.
    map "$http_origin|$host|$http_x_forwarded_host|$http_x_forwarded_proto|$http_sec_fetch_site" $researchiq_origin {
        default $http_origin;
        "http://localhost:80|localhost|zxcpn3pm-80.inc1.devtunnels.ms|https|same-origin" "https://zxcpn3pm-80.inc1.devtunnels.ms";
    }

    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    upstream minio {
        server minio:9000;
    }

    # Default server block for both IP and nip.io access
    server {
        # change the port you want to use, but not 3000
        listen 80 default_server;
        # support any nip.io domain and direct IP access
        # if you want to deploy on a cloud server, 
        # you can change the server_name to your server's domain name
        server_name _ *.nip.io;  

        # Backend API
        location /api {
            proxy_pass http://backend/api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin $researchiq_origin;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            # Retrieval and validated answer blocks can outlast nginx's 60s default.
            proxy_read_timeout 180s;
        }

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
            proxy_cache_bypass $http_upgrade;
        }

        # Next.js 静态文件和 API 路由
        location /_next/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # API Documentation (Redoc)
        location /redoc {
            proxy_pass http://backend/redoc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API Documentation (OpenAPI JSON)
        location /openapi.json {
            proxy_pass http://backend/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
